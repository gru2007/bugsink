# Builds the Team Frontress Bugsink image: upstream Bugsink plus the fixes on
# this branch, published to ghcr.io/<owner>/bugsink.
#
#   :frontress            the latest build of this branch
#   :<version>-frontress  the upstream version it is based on (e.g. 2.6.3-frontress)
#   :sha-<commit>         one exact build

name: Frontress image

on:
  push:
    branches: [ "frontress" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: frontress-image
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements.development.txt
      - name: Minidump tests
        # The one test that needs the external event-samples repository is left out.
        run: >
          python manage.py test files.test_minidump.DebugIdTests files.test_minidump.DifKindTests
          files.test_minidump.SourceContextTests

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm takes the version from the latest upstream tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bugsink"
          base=$(git describe --tags --abbrev=0)
          {
            echo "list<<EOF"
            echo "$image:frontress"
            echo "$image:${base}-frontress"
            echo "$image:sha-${GITHUB_SHA::12}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Bugsink with the Team Frontress fixes
          cache-from: type=gha
          cache-to: type=gha,mode=max
